jar {
    enabled = false
}

dependencies {

    implementation project(':clokey-domain')
    implementation project(':clokey-common')
    implementation project(':clokey-infrastructure')
    implementation project(':clokey-common-web')
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation "com.querydsl:querydsl-jpa:5.0.0:jakarta"
    
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'io.vanslog:spring-data-meilisearch:0.7.3'
}

// clokey-domain의 Q 클래스가 먼저 생성되도록 보장
tasks.named('compileJava') {
    dependsOn(':clokey-domain:compileJava')
}

// clokey-domain의 generated sources(Q 클래스)를 compile classpath에 포함
afterEvaluate {
    def domainProject = project(':clokey-domain')
    def generatedSourcesDir = new File(domainProject.buildDir, 'generated/sources/annotationProcessor/java/main')
    if (generatedSourcesDir.exists()) {
        sourceSets.main.java.srcDirs += generatedSourcesDir
    }
}
